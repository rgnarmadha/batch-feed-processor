spring:
  application:
    name: spring-batch-feed-processor
  
  # Database Configuration - Multiple profiles supported
  profiles:
    active: ${DATABASE_PROFILE:h2}
  
  # H2 Configuration (default)
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:feeddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CACHE_SIZE=65536;LOCK_TIMEOUT=10000}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
      minimum-idle: ${DATABASE_MIN_IDLE:5}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DATABASE_IDLE_TIMEOUT:600000}
      max-lifetime: ${DATABASE_MAX_LIFETIME:1800000}
      leak-detection-threshold: ${DATABASE_LEAK_DETECTION:60000}
    
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
      
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:create-drop}
      jdbc:
        batch_size: ${JPA_BATCH_SIZE:1000}
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
    show-sql: ${JPA_SHOW_SQL:false}
    database-platform: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    defer-datasource-initialization: true
    properties:
      hibernate:
        jdbc:
          batch_size: ${JPA_BATCH_SIZE:1000}
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        generate_statistics: false

---
# MySQL Configuration Profile
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/feedprocessor?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DATABASE_USERNAME:feeduser}
    password: ${DATABASE_PASSWORD:feedpassword}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:create-drop}
    defer-datasource-initialization: true
  h2:
    console:
      enabled: false

---
# Production MySQL Configuration Profile
spring:
  config:
    activate:
      on-profile: mysql-prod
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: false
    
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
      table-prefix: BATCH_

# Feed Processing Configuration
feed:
  processor:
    # Directory configurations (environment-specific)
    inputDirectory: ${FEED_INPUT_DIR:input}
    processedDirectory: ${FEED_PROCESSED_DIR:processed} 
    errorDirectory: ${FEED_ERROR_DIR:error}
    
    # Note: Feed configurations are now stored in database tables:
    # - feed_configs: Main feed configuration (name, file pattern, table name, etc.)
    # - feed_column_configs: Column definitions with types and constraints
    # Use data.sql to initialize feed configurations or manage via database

# Scheduling Configuration
scheduling:
  enabled: true
  cron: "0 0 2 * * ?" # Daily at 2 AM

# Logging
logging:
  level:
    com.example.feedprocessor: INFO
    org.springframework.batch: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
